; PlatformIO Project Configuration File

[platformio]
default_envs = esp32dev
build_dir = .pio/build_live

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
test_build_src = yes
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    throwtheswitch/Unity@^2.6.1
    https://github.com/pschatzmann/arduino-audio-tools.git
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP


[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv
upload_port = /dev/cu.usbserial
monitor_port = /dev/cu.usbserial
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_A252
build_src_filter =
    +<main.cpp>
    +<audio/AudioEngine.cpp>
    +<audio/Es8388Driver.cpp>
    +<config/A252ConfigStore.cpp>
    +<core/CommandDispatcher.cpp>
    +<core/PlatformProfile.cpp>
    +<props/EspNowBridge.cpp>
    +<slic/Ks0835SlicController.cpp>
    +<telephony/DtmfDecoder.cpp>
    +<telephony/TelephonyService.cpp>

[env:esp32dev-bt-migrate]
board = esp32dev
board_build.partitions = huge_app.csv
upload_port = /dev/cu.usbserial
monitor_port = /dev/cu.usbserial
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_A252
    -DBT_BACKEND_EXPERIMENTAL=1
build_src_filter =
    +<main.cpp>
    +<audio/AudioEngine.cpp>
    +<audio/Es8388Driver.cpp>
    +<config/A252ConfigStore.cpp>
    +<core/CommandDispatcher.cpp>
    +<core/PlatformProfile.cpp>
    +<props/EspNowBridge.cpp>
    +<slic/Ks0835SlicController.cpp>
    +<telephony/DtmfDecoder.cpp>
    +<telephony/TelephonyService.cpp>

[env:test]
platform = espressif32
board = esp32dev
framework = arduino
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    throwtheswitch/Unity@^2.6.1
    knolleary/PubSubClient@^2.8
    https://github.com/luisllamasbinaburo/Arduino-List.git#master
    https://github.com/pschatzmann/arduino-audio-tools.git

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_PROFILE_ESP32_S3
